[project]
name = "humkit"
version = "0.1.0"
description = "Whole-body control stack for the Unitree G1 humanoid in MuJoCo."
readme = "README.md"
authors = [
    { name = "AkshayArjun", email = "aakshay1114@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.17.0",
    "numpy>=2.2.6",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "mypy>=2.4.1",
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"] # errors, pyflakes, import sorting, bugbear, pyupgrade

[tool.mypy]
strict = true

[tool.coverage.run]
omit = ["src/humkit/view.py", "src/humkit/run.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# MuJoCo ships no type stubs. Robot is the only module that touches it, so the
# Any values it produces are converted to typed values there.
module = ["mujoco", "mujoco.*"]
ignore_missing_imports = true
